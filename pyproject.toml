[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "d2dash"
version = "0.1.0"
description = "In-car dashboard for a Land Rover Discovery 2 Td5: engine + SLABS live data and faults on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
# Runtime deps are the Ostler platform and its Discovery 2 pack. Neither is on PyPI yet:
#   pip install "openostler @ git+https://github.com/openostler/ostler@main"
#   pip install "d2diag @ git+https://github.com/openostler/ostler-pack-lr-d2@main"
# The simulator (D2DASH_SIMULATE=1) runs with no dependencies at all.
dependencies = []

[project.scripts]
d2dash = "d2dash.__main__:main"

[tool.setuptools.packages.find]
include = ["d2dash*"]

[tool.setuptools.package-data]
d2dash = ["static/*"]
